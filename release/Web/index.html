<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManWin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="beer.min.css">
  <link rel="stylesheet" href="manwin-theme.css">
  <style>.language-picker{display:grid;gap:7px;margin:24px 14px 0;color:#8993a5;font-size:12px}.language-picker select{width:100%;padding:8px}</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span>ManWin <b>Performance Overlay</b></span></div>
    <nav><button class="nav active" data-view="dashboard-view">Dashboard</button><button class="nav" data-view="design-view">Diseño OSD</button><button class="nav" data-view="usage-view">Cómo usar</button></nav>
    <div class="language-picker"><label for="language-select">Idioma</label><select id="language-select"><option value="es">Español</option><option value="en">English</option></select></div>
    <div class="side-note"><span>LibreHardwareMonitor</span></div>
  </aside>
  <main>
    <header><div><p class="eyebrow">PERFORMANCE OVERLAY</p><h1 id="page-title">Dashboard</h1></div></header>
    <section id="dashboard-view" class="view"></section>
    <section id="design-view" class="view hidden">
      <article class="card overlay-config"><h3>Elementos del OSD</h3><p class="muted">Activa las métricas que quieres mostrar dentro del juego.</p><div class="large-checks"><label><input type="checkbox" data-setting="cpu" checked> CPU</label><label><input type="checkbox" data-setting="gpu" checked> GPU</label><label><input type="checkbox" data-setting="ram" checked> RAM</label><label><input type="checkbox" data-setting="vram" checked> VRAM</label><label><input type="checkbox" data-setting="clocks" checked> Frecuencias</label><label><input type="checkbox" data-setting="power"> Consumo</label><label><input type="checkbox" data-setting="memoryPercent"> Memoria en porcentaje</label><label><input type="checkbox" data-setting="frametimeGraph"> Gráfica de frametime</label></div></article>
    </section>
    <div id="toast" class="toast"></div>
  </main>
  <script src="app.js"></script>
  <script type="module" src="beer.min.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
